<mat-form-field class="example-full-width">
    <mat-label>Search</mat-label>
    <input matInput type="text" [(ngModel)]="searchText" (input)="onSearch()" placeholder="Search any Contact">
</mat-form-field>

<h1>Contact List</h1>

<table border="1" width="100%" cellSpacing="0" cellPadding="8">
    <tr>
        <th>Name</th>
        <th>Country Code</th>
        <th>Phone Number</th>
    </tr>
    <tr *ngFor="let contact of filteredContacts">
        <th>{{contact.name}}</th>
        <th>{{contact.countryCode}}</th>
        <th>{{contact.contactNumber}}</th>
    </tr>
</table>
