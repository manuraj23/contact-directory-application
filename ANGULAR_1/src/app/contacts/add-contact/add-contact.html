<h2>Add Contact</h2>

<form #contactForm="ngForm" (ngSubmit)="addContact(contactForm)">


  <!-- Name -->
  <input
  type="text"
  placeholder="Name"
  [(ngModel)]="contact.name"
  name="name"
  required
/>


  <!-- Country Code Dropdown -->
  <select
  [(ngModel)]="contact.countryCode"
  name="countryCode"
  required
>
  <option value="">Select Country</option>
  <option *ngFor="let country of countryCodes"
          [value]="country.dial_code">
    {{ country.name }} ({{ country.dial_code }})
  </option>
</select>


  <!-- Phone -->
  <input
  type="text"
  placeholder="Phone Number"
  [(ngModel)]="contact.phone"
  name="phone"
  required
/>
<!--  Phone validation error message -->
  <div *ngIf="phoneError" style="color: red; font-size: 12px;">
    {{ phoneError }}
  </div>


  <button type="submit" [disabled]="contactForm.invalid">
  Add Contact
</button>

</form>
