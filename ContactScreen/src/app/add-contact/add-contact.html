<form (ngSubmit)="addContact()" class="contact-form">
  <label>Name:</label>
  <input type="text" [(ngModel)]="name" name="name" required />
  <label>Country Code:</label>
  <div *ngIf="loading">Loading countries...</div>
  <select *ngIf="!loading" [(ngModel)]="selectedCountryCode" name="countryCode" required>
    <option value="">Select Country</option>
    <option *ngFor="let c of countries" [value]="c.dialCode">
      {{ c.name }} - ({{ c.dialCode }})
    </option>
  </select>
  <label>Phone:</label>
  <input type="text" [(ngModel)]="phone" name="phone" required />
  <button type="submit">Add Contact</button>
</form>
