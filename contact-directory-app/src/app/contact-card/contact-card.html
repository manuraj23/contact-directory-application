<div class="flex flex-col justify-center items-start p-2 gap-2 bg-gray-100 rounded-lg w-84 hover:scale-105 duration-300">
  <div>
    <span class="font-semibold text-md">Name: </span>
    <span class="font-light text-md">{{contactData["contactName"]}}</span>
  </div>
  <div class="flex justify-center items-center gap-3">
    <span class="font-semibold text-md">Contact Info:</span>
    <span class="font-light text-md">{{contactData.contactId}}</span>
    <button
      class="px-2 py-1 text-xs bg-amber-500 text-white rounded-lg hover:bg-amber-400 font-bold"
      (click)="copyToClipboard()"
    >
      {{ buttonText }}
    </button>
  </div>
  <div>
      <button
        type="button"
        (click)="deleteContact(contactData.contactId)"
        class="px-3 py-2 text-xs w-18 bg-red-600 text-white mr-4 rounded-lg hover:bg-red-700 font-bold"
      >
        Delete
      </button>
  </div>
</div>
