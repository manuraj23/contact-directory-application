<div class="formcontainer">
    <h3>Add Contacts</h3>

    <div class="form">
        <form #contactForm="ngForm" (ngSubmit)="save(contactForm, contactForm.value)">
            <div class="form-items">
                <label for="Name">Name: </label>
                <input #name="ngModel" id="Name" type="text" name="name" ngModel required>
                <span class="error" *ngIf="name.touched && name.invalid">* Name is required</span>
            </div>
            <div class="form-items">
                <label for="PhoneNo">Phone Number: </label>
                <select #countrycode="ngModel" id="PhoneNo" type="number" name="countryCode" ngModel required>
                    <option></option>
                    <option *ngFor="let code of countryCodeList" [value]="code.dial_code">{{code.code}}  {{code.dial_code}}</option>
                </select>
                <input #phoneno="ngModel" id="PhoneNo" name="phoneNo" ngModel required minlength="8" maxlength="12">
                <span class="error" *ngIf="countrycode.touched && countrycode.invalid || phoneno.touched && phoneno.invalid ">* Country Code and Phone Number are required </span>
                <span class="error" *ngIf="phoneExists">* Phone number already exists</span>
            </div>
            <div class="save-reset-button">
                <button type="submit" [disabled]="contactForm.invalid">Save</button>
                <button type="button" (click)="reset(contactForm)">Reset</button>
            </div>
        </form>
    </div>
</div>
