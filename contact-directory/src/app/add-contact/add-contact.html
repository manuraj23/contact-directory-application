<div class="formcontainer">
    <h3>Add Contacts</h3>

    <div class="form">
        <form #contactForm="ngForm" (ngSubmit)="save(contactForm, contactForm.value)">
            <div class="form-items">
                <label for="Name">Name: </label>
                <input id="Name" type="text" name="name" ngModel required>
            </div>
            <div class="form-items">
                <label for="PhoneNo">Phone Number: </label>
                <select id="PhoneNo" type="number" name="countryCode" ngModel required>
                    <option></option>
                    <option *ngFor="let code of countryCodeList" [value]="code.dial_code">{{code.code}}  {{code.dial_code}}</option>
                </select>
                <input id="PhoneNo" name="phoneNo" ngModel required minlength="10">
            </div>
            <div class="save-reset-button">
                <button type="submit" [disabled]="contactForm.invalid">Save</button>
                <button type="button" (click)="reset(contactForm)">Reset</button>
            </div>
        </form>
    </div>
</div>
