<div class="search">
    <h3>Search</h3> 
    <input type="text" [(ngModel)]="searchText" (input)="onSearch()">
</div>
<div class="viewcontacts">
    <h3>Contacts</h3>
    <div *ngFor = 'let contact of contactList' class="listcontacts">
        <p>{{contact.name}}</p>
        <p>{{contact.countryCode}} {{contact.phoneNo}}</p>
    </div>
</div>
