<div class="w-full h-full flex justify-center items-start">
  <div
    class="mt-24 border-2 border-gray-300 shadow-xl w-76 flex flex-col justify-center items-center rounded-lg"
  >
    <h1 class="font-bold text-grey-500 py-4 bg-sky-600 w-full text-white text-center rounded-lg">
      Apply Leaves & WFHs
    </h1>
    <form
      class="flex flex-col justify-center items-center py-3 px-2 w-full"
      [formGroup]="applicationGroup"
      (ngSubmit)="onSubmit()"
    >
      <select
      formControlName="type"
        class="w-full h-10 px-3 py-2 rounded-lg border-2 border-gray-400/30 mt-6"
      >
        <option value="" disabled>Select Leave Type</option>
        <option value="leave">Leave</option>
        <option value="wfh">WFH</option>
      </select>

      <input
        type="date"
        formControlName="from"
        placeholder="Enter from date"
        class="w-full h-10 px-3 py-2 rounded-lg border-2 border-gray-400/30 mt-6"
      />
      <input
        type="date"
        formControlName="to"
        placeholder="Enter to date"
        class="w-full h-10 px-3 py-2 rounded-lg border-2 border-gray-400/30 mt-6"
      />
      <textarea
        formControlName="reason"
        placeholder="Enter Reason"
        class="w-full h-16 px-3 py-2 rounded-lg border-2 border-gray-400/30 mt-6"
      ></textarea>

      <button
        type="button"
        (click)="applyLeave()"
        [disabled]="reason!.invalid || type!.invalid || !loggedIn"
        class="w-full h-10 px-3 py-2 rounded-lg bg-emerald-600 text-white text-center font-bold mt-6 hover:bg-emerald-700 cursor-pointer"
      >
        Submit
      </button>
    </form>
  </div>
</div>
