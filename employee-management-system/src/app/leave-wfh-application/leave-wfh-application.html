<h2>Apply Leave / WFH</h2>

<form #loginForm="ngForm" (ngSubmit)="applyRequest(loginForm, loginForm.value)">

    <select #type="ngModel" name="type" required ngModel>
        <option value="">Select Type</option>
        <option value="LEAVE">Leave</option>
        <option value="WFH">Work From Home</option>
    </select><br><br>

    <input type="date" #fromDate="ngModel" name="fromDate" required ngModel /><br><br>
    <input type="date" #toDate="ngModel" name="toDate" required ngModel /><br><br>

    <textarea placeholder="Reason" #reason="ngModel" name="reason" ngModel required></textarea><br><br>

    <button type="submit" [disabled]="loginForm.invalid">Apply</button><br><br>
</form>

<hr />

<h2>My Requests</h2>

<table class="table">
    <tr>
        <th>Type</th>
        <th>From</th>
        <th>To</th>
        <th>Status</th>
        <th>Action</th>
    </tr>

    <tr *ngFor="let req of myRequests">
        <td>{{ req.type }}</td>
        <td>{{ req.fromDate }}</td>
        <td>{{ req.toDate }}</td>
        <td> {{ req.status }} </td>
        <td> <button *ngIf="req.status === 'Pending'" (click)="cancelRequest(req.reqid)">Cancel</button></td>
    </tr>
</table>
