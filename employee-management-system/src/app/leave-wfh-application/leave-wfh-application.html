<h2>Apply Leave / WFH</h2>

<form (ngSubmit)="applyRequest()">

    <select [(ngModel)]="form.type" name="type" required>
        <option value="">Select Type</option>
        <option value="LEAVE">Leave</option>
        <option value="WFH">Work From Home</option>
    </select><br><br>

    <input type="date" [(ngModel)]="form.fromDate" name="fromDate" required /><br><br>
    <input type="date" [(ngModel)]="form.toDate" name="toDate" required /><br><br>

    <textarea placeholder="Reason" [(ngModel)]="form.reason" name="reason" required></textarea><br><br>

    <button type="submit">Apply</button><br><br>
</form>

<hr />

<h2>My Requests</h2>

<table>
    <tr>
        <th>Type</th>
        <th>From</th>
        <th>To</th>
        <th>Status</th>
    </tr>

    <tr *ngFor="let req of myRequests">
        <td>{{ req.type }}</td>
        <td>{{ req.fromDate }}</td>
        <td>{{ req.toDate }}</td>
        <td [ngClass]="req.status.toLowerCase()"> {{ req.status }} </td>
    </tr>
</table>
