<div class="attendance-page">

  <div class="summary">
    <div class="card present">Present: {{ summary.present }}</div>
    <div class="card wfh">WFH: {{ summary.wfh }}</div>
    <div class="card leave">Leave: {{ summary.leave }}</div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let a of attendance">
        <td>{{ a.date }}</td>
        <td>
          <span [ngClass]="a.status">{{ a.status }}</span>
        </td>
      </tr>
    </tbody>
  </table>

</div>
