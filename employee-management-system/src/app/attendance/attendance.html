<ul>
  <li>Present: {{ summary.present }}</li>
  <li>WFH: {{ summary.wfh }}</li>
  <li>Leave: {{ summary.leave }}</li>
</ul>

<table class="table">
  <thead>
    <tr>
      <th scope="col">Date</th>
      <th scope="col">Status</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let a of attendance">
      <td>{{ a.date }}</td>
      <td>
        <span [ngClass]="a.status">{{ a.status }}</span>
      </td>
    </tr>
  </tbody>
</table>
