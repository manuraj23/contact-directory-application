<div>

  <div>
    <div>Present: {{ summary.present }}</div>
    <div>WFH: {{ summary.wfh }}</div>
    <div>Leave: {{ summary.leave }}</div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let a of attendance">
        <td>{{ a.date }}</td>
        <td>
          <span [ngClass]="a.status">{{ a.status }}</span>
        </td>
      </tr>
    </tbody>
  </table>

</div>
