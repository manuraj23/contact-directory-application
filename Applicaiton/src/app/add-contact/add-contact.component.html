<h2>Add Contact</h2>
<div class="form-container">
  <h2>Add Contact</h2>

  <form [formGroup]="contactForm">
    <input
      type="text"
      placeholder="Enter name"
      formControlName="name"
    />
    <select formControlName="country" (change)="onCountryChange()">
      <option value="">Select Country</option>
      <option *ngFor="let c of countries" [value]="c.name">
        {{ c.flag }} {{ c.name }} ({{ c.code }})
      </option>
    </select>
    <input
      type="number"
      placeholder="Enter mobile number"
      formControlName="mobile"
    />

    <small *ngIf="selectedCountry && !isMobileValid()">
      Mobile number must be {{ selectedCountry.length }} digits
    </small>

    <button
      type="button"
      (click)="saveContact()"
      [disabled]="contactForm.invalid && !isMobileValid()"
    >
      Save Contact
    </button>

  </form>
</div>
