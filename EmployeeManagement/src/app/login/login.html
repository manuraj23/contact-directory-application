<div class="container">

  <h2>{{ isLoginMode ? 'Login' : 'Signup' }}</h2>

  <form *ngIf="isLoginMode">

    <label>Role</label>
    <select [(ngModel)]="role" name="role">
      <option value="employee">Employee</option>
      <option value="hr">HR</option>
    </select>

    <label>Email</label>
    <input type="email" [(ngModel)]="loginEmail" name="loginEmail">

    <label>Password</label>
    <input type="password" [(ngModel)]="loginPassword" name="loginPassword">

    <button type="button" (click)="login()">Login</button>
   
  

    <p class="switch-text">
      Don’t have an account?
      <span (click)="toggleMode()">Signup</span>
    </p>

  </form>

  <form *ngIf="!isLoginMode">

    <label>First Name</label>
    <input type="text" [(ngModel)]="firstName" name="firstName">

    <label>Last Name</label>
    <input type="text" [(ngModel)]="lastName" name="lastName">

    <label>Email</label>
    <input type="email" [(ngModel)]="signupEmail" name="signupEmail">

    <label>Mobile</label>
  <input type="text" [(ngModel)]="mobile" name="mobile">
    <label>Password</label>
    <input type="password" [(ngModel)]="signupPassword" name="signupPassword">

    <label>Re-enter Password</label>
    <input type="password" [(ngModel)]="rePassword" name="rePassword">
    
 

  <label>Address</label>
  <input type="text" [(ngModel)]="address" name="address">

  <label>City</label>
  <input type="text" [(ngModel)]="city" name="city">

  <label>State</label>
  <input type="text" [(ngModel)]="state" name="state">

  <label>Pincode</label>
  <input type="text" [(ngModel)]="pincode" name="pincode">

  <label>Emergency Contact Name</label>
  <input type="text" [(ngModel)]="emergencyName" name="emergencyName">

  <label>Emergency Contact Number</label>
  <input type="text" [(ngModel)]="emergencyMobile" name="emergencyMobile">


    <button type="button" (click)="signup()">Signup</button>

    <p class="switch-text">
      Already have an account?
      <span (click)="toggleMode()">Login</span>
    </p>

  </form>

</div>
